<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Panel - Totally Real</title>
    <meta name="description" content="Totally not a fake admin panel, trust us bro."/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/a142bcd3be.js" crossorigin="anonymous"></script>
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0f0f0f',
                        text: 'rgb(201 163 45 / var(--tw-text-opacity, 1))',
                        accent: '#798d3e',
                        border: '#5D4037',
                        yellowbtn: '#FDD835',
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-background text-text min-h-screen flex items-center justify-center px-4">
<div class="bg-[#1a1a1a] text-white max-w-md w-full p-6 rounded-xl shadow-lg border border-border">
    <h1 class="text-2xl font-bold text-center mb-4">
        Admin Panel
    </h1>
    <div class="mb-4 text-center">
        <p class="text-sm mb-2">Wallet Balance:</p>
        <p class="text-3xl font-mono text-green-400">167857.00 SOL</p>
    </div>
    <div class="mb-6">
        <label for="solAddress" class="block text-sm mb-1">Withdraw to:</label>
        <input type="text" id="solAddress" placeholder="Enter SOL address"
               class="w-full p-2 rounded bg-black border border-border text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent">
    </div>
    <button id="withdraw"
            class="w-full bg-yellowbtn text-black font-bold py-2 px-4 rounded hover:bg-yellow-500 transition-colors duration-200 flex justify-center items-center gap-2">
        <span id="withdraw-text">Withdraw</span>
    </button>

    <!-- Success Message -->
    <div id="success-message"
         class="hidden mt-4 text-green-400 text-sm text-center transition-opacity duration-300">
        ✅ 167857.00 SOL sent to
    </div>

    <!-- Error Message -->
    <div id="error-message"
         class="hidden mt-4 text-red-500 text-sm text-center transition-opacity duration-300">
        ❌ Enter a SOL address.
    </div>
</div>

<audio id="withdraw-audio" src="static/audio/withdraw.mp3" muted></audio>

<script>
    const audio = document.getElementById('withdraw-audio');
    const withdrawBtn = document.getElementById('withdraw');
    const withdrawText = document.getElementById('withdraw-text');
    const success = document.getElementById('success-message');
    const error = document.getElementById('error-message');
    const input = document.getElementById('solAddress');

    withdrawBtn.addEventListener('click', () => {
        const address = input.value.trim();

        if (address === "") {
            error.classList.remove('hidden');
            success.classList.add('hidden');
            return;
        }

        // Start processing
        error.classList.add('hidden');
        success.classList.add('hidden');
        withdrawBtn.disabled = true;
        withdrawText.textContent = "Processing...";

        // Play sound
        audio.muted = false;
        audio.play();

        // After 8s, show success
        setTimeout(() => {
            withdrawText.textContent = "Withdraw";
            withdrawBtn.disabled = false;

            success.textContent = `✅ 167857.00 SOL sent to ${address}`;
            success.classList.remove('hidden');
        }, 8000);
    });
</script>
</body>
</html>
